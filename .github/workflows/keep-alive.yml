name: Keep Render Alive

on:
  schedule:
    # Runs every 14 minutes (Render free tier spins down after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    name: Ping SubMaker Instance
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        run: |
          echo "Pinging SubMaker at https://stremiosubmaker-n47r.onrender.com/manifest.json..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "https://stremiosubmaker-n47r.onrender.com/manifest.json" || echo "000")
          echo "HTTP status code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "✅ SubMaker is active and awake!"
          else
            echo "⚠️ Non-200 response ($HTTP_STATUS). Retrying with root endpoint..."
            curl -s -o /dev/null -w "%{http_code}" -m 30 "https://stremiosubmaker-n47r.onrender.com/" || true
          fi
